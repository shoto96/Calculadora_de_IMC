<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="assets/css/style.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Calculadora de IMC</title>
</head>
<body>
    <main id="container">
        <section id="img">
            <img src="assets/images/ilustration.svg" alt="Ilustração de pessoa se exercitando e cuidando da saúde">
        </section>

        <section id="calculator">
            <form id="form">
                <h1 id="title">
                    Calculadora <span>IMC</span>
                </h1>

                <div class="input-box">
                    <label for="weight">
                        Peso em kg
                    </label>
                    <div class="input-field">
                        <i class="fa-solid fa-weight-hanging"></i>
                        <input type="number" id="weight" name="weight" placeholder="Ex: 70" step="0.1" min="1" max="500" required>
                        <span>Kg</span>
                    </div>
                    <small class="error-msg" id="weight-error"></small>
                </div>

                <div class="input-box">
                    <label for="height">
                        Altura em metros
                    </label>
                    <div class="input-field">
                        <i class="fa-solid fa-ruler-vertical"></i>
                        <input type="number" id="height" name="height" placeholder="Ex: 1,75" step="0.01" min="0.3" max="3" required>
                        <span>m</span>
                    </div>
                    <small class="error-msg" id="height-error"></small>
                </div>
                
                <button type="submit" id="calculate">
                    <i class="fa-solid fa-calculator"></i>
                    Calcular
                </button>
            </form>    
            
            <div id="infos" class="hidden">
                <div id="result">
                    <div id="bmi">
                        <span id="value">--</span>
                        <span>Seu IMC</span>
                    </div>
                    <div id="description">
                        <span id="category">Preencha os dados acima</span>
                        <span id="emoji"></span>
                    </div>  
                </div>

                <div id="more_info">
                    <a href="https://mundoeducacao.uol.com.br/saude-bem-estar/imc.htm" target="_blank" rel="noopener noreferrer">
                        Mais informações sobre o IMC
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                </div>
            </div>   
        </section>
    </main>
    <footer>
        <p>&copy; 2026 - Desenvolvido por Jean Vieira</p>
    </footer>
    <script src="assets/js/script.js"></script>
</body>
</html>
